services:
  - type: web
    name: dsa-tracker-api
    runtime: python
    rootDir: dsa-tracker/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: dsa-tracker-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/tracker.db
      - key: CORS_ORIGINS
        sync: false